openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: meechain
    description: Read-only MeeChain operations data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /meechain/network:
    get:
      operationId: getMeechainNetwork
      tags: [meechain]
      summary: Read MintMe inbound network status
      description: Reads the public MintMe RPC endpoint and returns verified network and recent block data. This endpoint cannot write to the chain.
      responses:
        "200":
          description: Network status and recent blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeeChainNetwork"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MeeChainBlockMetric:
      type: object
      properties:
        blockNumber:
          type: string
        timestamp:
          type: string
          format: date-time
        transactionCount:
          type: integer
        gasUsed:
          type: string
        intervalSeconds:
          type: ["number", "null"]
      required:
        - blockNumber
        - timestamp
        - transactionCount
        - gasUsed
        - intervalSeconds
    MeeChainNetwork:
      type: object
      properties:
        name:
          type: string
          enum: [MintMe]
        rpcUrl:
          type: string
          format: uri
        expectedChainId:
          type: integer
        observedChainId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [connected, wrong_network, unavailable]
        latestBlock:
          oneOf:
            - $ref: "#/components/schemas/MeeChainBlockMetric"
            - type: "null"
        recentBlocks:
          type: array
          items:
            $ref: "#/components/schemas/MeeChainBlockMetric"
        checkedAt:
          type: string
          format: date-time
        message:
          type: ["string", "null"]
      required:
        - name
        - rpcUrl
        - expectedChainId
        - observedChainId
        - status
        - latestBlock
        - recentBlocks
        - checkedAt
        - message

