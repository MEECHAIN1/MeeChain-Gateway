kind = "data-app"
previewPath = "/"
title = "MeeChain Ops Dashboard"
description = "A read-only operations dashboard for MeeChain, showing the live MintMe inbound network connection separately from MeeChain-owned membership, eligibility, exchange, and treasury governance."
version = "1.0.0"
id = "artifacts/data-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24452

[services.development]
run = "pnpm --filter @workspace/data-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/data-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/data-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24452"
BASE_PATH = "/"
